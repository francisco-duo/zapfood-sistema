# Compose de producao. Rodar sempre a partir da raiz do repositorio:
#   docker compose -f infra/compose/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Diferencas em relacao ao docker-compose.yml de desenvolvimento:
#   - imagens multi-stage (builder + runtime), sem bind mount de codigo-fonte
#   - todos os containers de aplicacao rodam com usuario non-root
#   - db/redis/rabbitmq nao publicam porta para o host (somente rede interna)
#   - migracoes do banco rodam em um servico dedicado antes da API subir
#   - frontends sao servidos como estatico via nginx (sem vite dev server)
#
# Cada servico de app tem "build" (deploy manual local, via --build) e
# "image" (deploy via CI, que so dá "pull" nessa tag e nunca builda no
# servidor). IMAGE_REGISTRY/IMAGE_TAG vem do .env.production — ver
# .env.production.example, e tem que bater com o path publicado pelo job
# "build" do workflow (ghcr.io/<owner>/<repo>/<servico>). Sem eles
# definidos, cai no fallback local "zapfood/<servico>:prod".
#
# Todo container aplica "logging: *logging-padrao": driver json-file do
# proprio Docker com rotacao (10MB x 5 arquivos = 50MB/container no maximo).
# App loga em JSON estruturado (ver app/core/logging_config.py); quem roda
# imagem de terceiro (db/redis/rabbitmq/proxy/certbot) loga no formato deles
# mesmo, só a rotação é compartilhada.

x-logging: &logging-padrao
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    image: ${IMAGE_REGISTRY:-zapfood}/backend:${IMAGE_TAG:-prod}
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../../.env.production
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    logging: *logging-padrao
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    image: ${IMAGE_REGISTRY:-zapfood}/backend:${IMAGE_TAG:-prod}
    container_name: zapfood_api
    command:
      [
        "uvicorn", "app.main:app",
        "--host", "0.0.0.0",
        "--port", "8000",
        "--workers", "${API_WORKERS:-4}",
        # Atras do proxy nginx: confia no X-Forwarded-* pra logs/URLs saírem
        # com o esquema/IP reais em vez do que o proxy vê (http/127.0.0.1).
        "--proxy-headers",
        "--forwarded-allow-ips", "*",
      ]
    env_file:
      - ../../.env.production
    # Sem porta publicada: em producao o acesso e sempre via proxy (443).
    # Descomente para bater direto na API durante depuracao local.
    # ports:
    #   - "${API_PORT:-8001}:8000"
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *logging-padrao
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    image: ${IMAGE_REGISTRY:-zapfood}/backend:${IMAGE_TAG:-prod}
    container_name: zapfood_worker
    command: ["python", "-m", "app.messaging.consumer"]
    env_file:
      - ../../.env.production
    networks:
      - backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f app.messaging.consumer || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging-padrao
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: zapfood_db
    env_file:
      - ../../.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - zapfood_pgdata_prod:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging-padrao
    restart: unless-stopped

  # Dump completo do Postgres a cada BACKUP_INTERVAL_HORAS, comprimido e com
  # rotação por idade — ver infra/scripts/backup-postgres.sh (o mesmo
  # container também serve pra rodar um backup avulso com "--once", e
  # infra/scripts/restore-postgres.sh cobre o caminho de restauração).
  backup:
    image: postgres:16-alpine
    container_name: zapfood_backup
    entrypoint: ["sh", "/scripts/backup-postgres.sh"]
    env_file:
      - ../../.env.production
    environment:
      BACKUP_RETENTION_DIAS: ${BACKUP_RETENTION_DIAS:-14}
      BACKUP_INTERVAL_HORAS: ${BACKUP_INTERVAL_HORAS:-24}
    volumes:
      - ../scripts/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - zapfood_backups_prod:/backups
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    logging: *logging-padrao
    restart: unless-stopped

  # Monitoramento básico (sem dependência externa): /health/ready da API,
  # idade do último backup e uso de disco do volume de backups, tudo logado
  # em JSON — ver infra/scripts/monitor.sh e infra/OPERACOES.md.
  monitor:
    image: curlimages/curl:8.10.1
    container_name: zapfood_monitor
    entrypoint: ["sh", "/scripts/monitor.sh"]
    environment:
      MONITOR_API_URL: http://api:8000/health/ready
      MONITOR_BACKUP_MAX_IDADE_HORAS: ${MONITOR_BACKUP_MAX_IDADE_HORAS:-30}
      MONITOR_INTERVAL_SEGUNDOS: ${MONITOR_INTERVAL_SEGUNDOS:-300}
    volumes:
      - ../scripts/monitor.sh:/scripts/monitor.sh:ro
      - zapfood_backups_prod:/backups:ro
    networks:
      - backend
    depends_on:
      - api
      - backup
    logging: *logging-padrao
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zapfood_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - zapfood_redis_data_prod:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging-padrao
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zapfood_rabbitmq
    env_file:
      - ../../.env.production
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - zapfood_rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging-padrao
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: ${IMAGE_REGISTRY:-zapfood}/frontend:${IMAGE_TAG:-prod}
    container_name: zapfood_frontend
    # Sem porta publicada: so o proxy fala com este container.
    # ports:
    #   - "${FRONTEND_PORT:-5174}:8080"
    networks:
      - public
    depends_on:
      - api
    logging: *logging-padrao
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: ${IMAGE_REGISTRY:-zapfood}/admin:${IMAGE_TAG:-prod}
    container_name: zapfood_admin
    # Sem porta publicada: so o proxy fala com este container.
    # ports:
    #   - "${ADMIN_PORT:-5175}:8080"
    networks:
      - public
    depends_on:
      - api
    logging: *logging-padrao
    restart: unless-stopped

  kds:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.kds
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    image: ${IMAGE_REGISTRY:-zapfood}/kds:${IMAGE_TAG:-prod}
    container_name: zapfood_kds
    # Sem porta publicada: so o proxy fala com este container.
    # ports:
    #   - "${KDS_PORT:-5176}:8080"
    networks:
      - public
    depends_on:
      - api
    logging: *logging-padrao
    restart: unless-stopped

  proxy:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.proxy
    image: ${IMAGE_REGISTRY:-zapfood}/proxy:${IMAGE_TAG:-prod}
    container_name: zapfood_proxy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      KDS_DOMAIN: ${KDS_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - zapfood_letsencrypt:/etc/letsencrypt:ro
      - zapfood_certbot_webroot:/var/www/certbot:ro
    networks:
      - public
      - backend
    depends_on:
      - frontend
      - admin
      - kds
      - api
    logging: *logging-padrao
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Renovacao automatica dos certificados (a emissao inicial e feita pelo
  # infra/scripts/init-letsencrypt.sh, rodado uma unica vez manualmente).
  certbot:
    image: certbot/certbot:latest
    container_name: zapfood_certbot
    volumes:
      - zapfood_letsencrypt:/etc/letsencrypt
      - zapfood_certbot_webroot:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'chmod -R o+rX /etc/letsencrypt/live /etc/letsencrypt/archive'; sleep 12h & wait $${!}; done"
    logging: *logging-padrao
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  public:
    driver: bridge

volumes:
  zapfood_pgdata_prod:
  zapfood_redis_data_prod:
  zapfood_rabbitmq_data_prod:
  zapfood_letsencrypt:
  zapfood_certbot_webroot:
  zapfood_backups_prod:
