services:
  api:
    build: .
    container_name: zapfood_api
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: zapfood_worker
    command: python -m app.messaging.consumer
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: zapfood_db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - zapfood_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zapfood_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zapfood_rabbitmq
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zapfood_frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - zapfood_frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: zapfood_admin
    ports:
      - "5175:5175"
    volumes:
      - ./admin:/app
      - zapfood_admin_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  kds:
    build: ./kds
    container_name: zapfood_kds
    ports:
      - "5176:5176"
    volumes:
      - ./kds:/app
      - zapfood_kds_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  zapfood_pgdata:
  zapfood_frontend_node_modules:
  zapfood_admin_node_modules:
  zapfood_kds_node_modules:
